[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pr-ready-checker"
version = "0.1.0"
description = "Pre-PR gate for Hermes Agent: checks whether a branch is ready for a pull request."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "phon-t" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]

[project.urls]
Homepage = "https://github.com/phon-t/pr-ready"
Repository = "https://github.com/phon-t/pr-ready"

# No [project.scripts] entry point: the plugin has no standalone CLI.
# Hermes loads it from the plugin directory (plugin.yaml) and exposes
# the `hermes pr-ready` command and the `pr_ready_check` tool itself.

[tool.pytest.ini_options]
testpaths = ["tests"]
# NOTE: pytest has no ini option for the import mode (it is CLI-only).
# The plugin root __init__.py therefore imports pr_ready with a
# try/except fallback, so the suite stays green under prepend mode too.

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pin the rule set this project was written against (ruff's default set
# in 0.15.x). Newer ruff versions enable extra rules by default; pinning
# keeps `ruff check` — and CI — deterministic across versions.
select = ["E4", "E7", "E9", "F"]
