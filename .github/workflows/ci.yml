name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: pip install pytest ruff
      - name: Run tests
        run: python -m pytest tests/ -q
      - name: Lint (ruff, if available)
        run: pip install ruff && ruff check pr_ready tests __init__.py
      - name: Format (ruff)
        run: ruff format --check pr_ready tests __init__.py
